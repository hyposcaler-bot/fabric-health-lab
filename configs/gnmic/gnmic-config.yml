username: admin
timeout: 10s

common_srl_subscriptions: &common_srl_subs
  skip-verify: true
  insecure: false
  password: NokiaSrl1!
  subscriptions:
    - srl-if-stats
    - srl-if-queue-stats
    - srl-bgp
    - srl-system-performance
    - srl-routes
    - srl-bridge
    - srl-apps
    - srl-net-instance

targets:
  leaf1:57400: *common_srl_subs
  leaf2:57400: *common_srl_subs
  leaf3:57400: *common_srl_subs
  leaf4:57400: *common_srl_subs
  leaf5:57400: *common_srl_subs
  leaf6:57400: *common_srl_subs
  spine1:57400: *common_srl_subs
  spine2:57400: *common_srl_subs

subscriptions:
  srl-system-performance:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /platform/control[slot=*]/cpu[index=all]/total
      - /platform/control[slot=*]/memory
  srl-if-stats:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /interface[name=ethernet-1/*]/admin-state
      - /interface[name=ethernet-1/*]/oper-state
      - /interface[name=ethernet-1/*]/statistics
      - /interface[name=ethernet-1/*]/traffic-rate
  srl-if-queue-stats:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /qos/interfaces/interface[interface-id=*]/output/queues/queue[queue-name=*]/queue-statistics/aggregate-statistics
  srl-routes:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /network-instance[name=*]/route-table/ipv4-unicast/statistics/
      - /network-instance[name=*]/route-table/ipv6-unicast/statistics/
  srl-bgp:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /network-instance[name=*]/protocols/bgp/statistics
  srl-bridge:
    mode: stream
    stream-mode: sample
    sample-interval: 5s
    paths:
      - /network-instance[name=*]/bridge-table/statistics/
  srl-apps:
    paths:
      - /system/app-management/application[name=*]
    mode: stream
    stream-mode: sample
    sample-interval: 5s
  srl-net-instance:
    paths:
      - /network-instance[name=*]/oper-state
    mode: stream
    stream-mode: sample
    sample-interval: 5s

outputs:
  prom-output:
    type: prometheus
    listen: :9273
    event-processors:
      - simple-starlark-processor
      - trim-prefixes
      - rename-srl-interface
      - oper-state-to-int
      - admin-state-to-int

processors:
  trim-prefixes:
    event-strings:
      value-names:
        - "^/state/.*"
      transforms:
        - trim-prefix:
            apply-on: "name"
            prefix: "/state/"

  oper-state-to-int:
    event-strings:
      value-names:
        - ".*"
      transforms:
        - replace:
            apply-on: "value"
            old: "up"
            new: "1"
        - replace:
            apply-on: "value"
            old: "down"
            new: "0"

  admin-state-to-int:
    event-strings:
      value-names:
        - ".*"
      transforms:
        - replace:
            apply-on: "value"
            old: "enable"
            new: "1"
        - replace:
            apply-on: "value"
            old: "disable"
            new: "0"
            
  rename-srl-interface:
    event-strings:
      tag-names:
        - "^interface_name"
        - "^remote_interface"
      transforms:
        - replace:
            apply-on: "value"
            old: "ethernet-(\\d+)/(\\d+)"
            new: "e$1-$2"

  simple-starlark-processor:
    event-starlark:
      script: /decorator.py
      debug: false